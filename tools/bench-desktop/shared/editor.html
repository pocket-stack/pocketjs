<!doctype html>
<!-- tools/bench-desktop/shared/editor.html — the web-stack half of the
     desktop benchmark (docs/bench). One file, loaded verbatim by BOTH the
     Electron and Tauri shells so the two web apps are byte-identical: a
     plain-text markdown editing surface with the same sample document
     apps/note wakes up with, the same 420x560 window, and the same typing
     storm the pocket host drives through its svc channel (--storm).

     READY protocol: after the first painted frame (double rAF), the page
     reports READY + epoch ms — through console.log under Electron (the main
     process forwards console messages to stdout) and through the `ready`
     command under Tauri.

     Storm protocol (query string): ?storm=CPS&start=MS&dur=MS inserts
     characters at the caret through the same execCommand path real typing
     takes, with the caret kept in view. -->
<html>
<head>
<meta charset="utf-8" />
<title>Bench Note</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #1c1c1e; color: #e6e6e6;
    font: 14px/1.45 -apple-system, "Inter", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 8px 12px; font-size: 11px; letter-spacing: 0.08em;
    color: #9a9a9e; border-bottom: 1px solid #2c2c2e;
  }
  #doc {
    flex: 1; overflow-y: auto; padding: 12px; outline: none;
    white-space: pre-wrap; word-break: break-word;
    font: 13px/1.5 "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<header>BENCH NOTE</header>
<div id="doc" contenteditable="plaintext-only" spellcheck="false"></div>
<script>
  const SAMPLE = `# Pocket Note

A markdown sticky for your desktop — one process, a real PocketJS app.

## What works

- **Bold**, *emphasis*, \`inline code\`, [links](https://pocketjs.dev)
- Bullet and numbered lists
  - one level of nesting
- Quotes, rules, fenced code

> The window is the ui surface: same core, same DrawList,
> same bytes as the PSP build.

\`\`\`
bun tools/build.ts note-main --density=2
cargo run -p note-widget
\`\`\`

---

1. The pencil toggles into editing; the eye back to preview
2. Drag to select in either mode; Cmd-C, Cmd-X, Cmd-V work
3. Cmd-Z / Shift-Cmd-Z undo and redo
4. Drag the header to move, the corner to resize; dots for the menu

*Idle costs nothing: no dirt, no frame.*
`;

  const doc = document.getElementById("doc");
  doc.textContent = SAMPLE;
  doc.focus();
  // Caret to the start, like the pocket note's freshly opened editor.
  const sel = window.getSelection();
  sel.collapse(doc.firstChild, 0);

  const params = new URLSearchParams(location.search);
  function report(line) {
    // Manual runs: the line lands in the devtools console.
    console.log(line);
    // Bench runs: POST to the runner's local listener (?port=N) — one
    // clock, one channel, identical for the Tauri and Electron shells.
    const port = params.get("port");
    if (port) {
      fetch(`http://127.0.0.1:${port}/report`, {
        method: "POST",
        body: line,
      }).catch(() => {});
    }
  }
  window.onerror = (msg, _src, lineNo) => report(`PAGE-ERROR ${msg} @${lineNo}`);

  requestAnimationFrame(() =>
    requestAnimationFrame(() => report(`READY ${Date.now()}`)),
  );

  // Typing storm: insert at the caret through the editing path, error-free
  // rate over time, caret kept visible — the web spelling of the pocket
  // host's --storm svc lines.
  const cps = Number(params.get("storm") || 0);
  if (cps > 0) {
    const startMs = Number(params.get("start") || 70000);
    const durMs = Number(params.get("dur") || 30000);
    const STORM = "the quick brown fox jumps over the lazy dog ";
    let inserted = 0;
    let k = 0;
    setTimeout(() => {
      const t0 = performance.now();
      const timer = setInterval(() => {
        const elapsed = performance.now() - t0;
        if (elapsed > durMs) {
          clearInterval(timer);
          report(`STORM-DONE ${inserted}`);
          return;
        }
        const due = Math.floor((elapsed / 1000) * cps);
        let batch = "";
        while (inserted < due) {
          batch += STORM[(k = (k + 8) % STORM.length)];
          inserted++;
        }
        if (batch) {
          doc.focus();
          document.execCommand("insertText", false, batch);
          const s = window.getSelection();
          if (s.rangeCount) {
            const r = s.getRangeAt(0).getBoundingClientRect();
            if (r.bottom > innerHeight) doc.scrollTop += r.bottom - innerHeight + 20;
          }
        }
      }, 16);
    }, startMs);
  }
</script>
</body>
</html>
