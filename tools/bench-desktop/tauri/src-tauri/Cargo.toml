# tools/bench-desktop/tauri — the Tauri v2 shell of the desktop benchmark:
# one WKWebView window over ../shared/editor.html (the same file Electron
# loads), the `ready` command forwarding the page's READY/STORM-DONE lines
# to stdout for the runner. Standalone crate, not part of any workspace.
[package]
name = "bench-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[workspace]
