# pocket3d-gles2 — the OpenGL ES 2 cooked-world backend used by the
# Symbian/OpenStrike native host.
#
# This stays a standalone workspace, like pocket3d-gu and pocket3d-vita.
# Host builds exercise its CPU planning/decoding path without linking a GL
# implementation; the custom Symbian target (`target_os = "none"`) enables
# the raw GLES2 submission path.

[package]
name = "pocket3d-gles2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "no_std-friendly OpenGL ES 2 renderer for cooked Pocket3D worlds"

[dependencies]
pocket3d-bsp = { path = "../pocket3d-bsp", default-features = false, features = ["libm"] }
# Symbian's allocator guarantees at most 8-byte alignment. `scalar-math`
# keeps Vec3/Mat4-containing cooked CPU structures within that contract.
glam = { version = "0.33", default-features = false, features = ["libm", "scalar-math"] }
libm = "0.2"

[workspace]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
