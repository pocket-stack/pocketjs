# pocketjs-symbian-core — pocketjs-core plus the GLES2 DrawList backend and
# deterministic capture rasterizer, exposed as a C static library for the
# Qt/Symbian host. QGLWidget owns the graphics context and presentation.
#
# This is deliberately a standalone workspace. The custom Symbian target
# needs nightly build-std while the desktop engine workspace stays on the
# normal host toolchain.
#
# Build from this directory (rust-toolchain.toml pins the compiler):
#   cargo build --release --locked \
#     --target targets/armv6-symbian-eabi.json \
#     -Z json-target-spec \
#     -Z build-std=core,alloc,compiler_builtins \
#     -Z build-std-features=compiler-builtins-mem

[package]
name = "pocketjs-symbian-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["standalone-extension-provider"]
standalone-extension-provider = []
# Reuse the no_std C ABI on Mach-O targets whose OS cfg is not `none`.
bare-platform = []
# Compile the fixed-function OpenGL ES 1.1 pipeline instead of the ES 2 one,
# for GPUs that predate shaders (the original iPhone's PowerVR MBX Lite).
gles1 = []
# Omit the GLES backend for framebuffer-only hosts such as Windows CE/GDI.
# The C ABI keeps its GL entry points, but they return failure without pulling
# graphics symbols into the native link.
software-only = []
# Route no_std allocations through host-owned functions. Windows CE hosts use
# this to avoid depending on the C runtime's allocator ABI.
host-allocator = []
# Report native boot checkpoints to hosts that expose pocket_host_boot_stage.
boot-stage = []

[dependencies]
pocketjs-core = { path = "../core" }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true

[workspace]
