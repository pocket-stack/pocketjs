[package]
name = "pocket-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The db module's reference core: SQLite behind the five-op contracts/spec/db.ts boundary, mountable as globalThis.db via pocket-mod"

[features]
# `mount` brings pocket-mod (and its QuickJS embedding) for the one-line
# globalThis.db install. A device host with its own QuickJS wiring turns
# it off (`default-features = false`) and drives DbModule directly — the
# MCU build then never compiles an engine it doesn't use.
default = ["mount"]
mount = ["dep:pocket-mod", "dep:anyhow"]

[dependencies]
pocketjs-core = { workspace = true }
pocket-mod = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
