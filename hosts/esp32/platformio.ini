[platformio]
default_envs = symbian_pocket
src_dir = firmware
include_dir = include
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<safety.cpp>
build_flags =
    -std=c++17

[esp32_base]
platform = espressif32@6.5.0
board = esp-wrover-kit
framework = arduino
; Single factory application.  The device is upgraded only over COM13, so the
; flash space normally reserved for OTA is available to PocketJS/QuickJS.
board_build.partitions = symbian_pocket.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
upload_port = COM13
monitor_port = COM13
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
    greiman/SdFat@2.2.3
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -D USER_SETUP_LOADED
    -D ST7735_DRIVER
    -D ST7735_BLACKTAB
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=-1
    -D TFT_RGB_ORDER=TFT_RGB
    -D LOAD_GLCD
    -D SPI_FREQUENCY=60000000
    -D SPI_READ_FREQUENCY=10000000
    -D SUPPORT_TRANSACTIONS

[env:probe]
extends = esp32_base
build_src_filter =
    +<probe.cpp>

[env:symbian_pocket]
extends = esp32_base
extra_scripts =
    pre:scripts/prebuild.py
build_flags =
    ${esp32_base.build_flags}
    ; build-std's compiler_builtins archive exports weak flash-resident
    ; mem* routines.  Bind libc's names to the ESP32 ROM implementations so
    ; early flash initialization remains safe while the cache is disabled.
    -Wl,--defsym=memcmp=0x4000c260
    -Wl,--defsym=memcpy=0x4000c2c8
    -Wl,--defsym=memmove=0x4000c3c0
    -Wl,--defsym=memset=0x4000c44c
    -Wl,--defsym=bcmp=0x4000c260
    -Wl,--defsym=strlen=0x400014c0
build_src_filter =
    +<main.cpp>
    +<safety.cpp>
    +<generated_assets.cpp>
