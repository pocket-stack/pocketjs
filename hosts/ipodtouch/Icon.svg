<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ios7-background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.48" stop-color="#070a11"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="ios7-highlight" cx="0.24" cy="0.08" r="0.86">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#60a5fa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pocket-ambient" cx="0.94" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ios7-mark" x1="4" y1="7" x2="28" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
  </defs>

  <!-- Edge-to-edge flat color; SpringBoard provides the installed icon mask. -->
  <rect width="1024" height="1024" fill="url(#ios7-background)"/>
  <rect width="1024" height="1024" fill="url(#ios7-highlight)"/>
  <rect width="1024" height="1024" fill="url(#pocket-ambient)"/>

  <!-- Exact compact Pocket mark geometry from site/assets/favicon.svg. -->
  <g id="pocket-mark" data-brand-source="site/assets/favicon.svg"
     transform="translate(96 96) scale(26)">
    <rect x="2" y="6" width="28" height="20" rx="6" fill="none"
          stroke="url(#ios7-mark)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="10" cy="16" r="3.1" fill="url(#ios7-mark)"/>
    <rect x="16" y="12.6" width="10" height="2.2" rx="1.1" fill="url(#ios7-mark)"/>
    <rect x="16" y="17.2" width="6.5" height="2.2" rx="1.1" fill="url(#ios7-mark)"/>
  </g>
</svg>
