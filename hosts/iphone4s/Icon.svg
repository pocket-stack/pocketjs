<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="590" height="600" viewBox="0 0 590 600">
  <defs>
    <linearGradient id="outer-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#8f949c"/>
      <stop offset="0.24" stop-color="#f7f8fa"/>
      <stop offset="0.63" stop-color="#5f646b"/>
      <stop offset="0.82" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#71767e"/>
    </linearGradient>
    <linearGradient id="outer-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.34" stop-color="#555b63"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#767b83"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#444951"/>
      <stop offset="0.18" stop-color="#14171c"/>
      <stop offset="0.58" stop-color="#050608"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.54" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#aab0b9"/>
      <stop offset="0.48" stop-color="#f9fafb"/>
      <stop offset="0.78" stop-color="#9da4ae"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="mark-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f1f4f8"/>
      <stop offset="1" stop-color="#d7dce4"/>
    </linearGradient>
    <linearGradient id="mark-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6bdc7"/>
      <stop offset="1" stop-color="#656c76"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Transparent corners and a precomposed chrome bezel match the iPhone 2G artwork. -->
  <rect x="13" y="13" width="564" height="574" rx="119" fill="#000000" opacity="0.55"
        filter="url(#soft-shadow)"/>
  <rect x="4" y="4" width="582" height="592" rx="126" fill="url(#outer-chrome)"/>
  <rect x="13" y="13" width="564" height="574" rx="116" fill="none"
        stroke="url(#outer-rim)" stroke-width="15"/>
  <rect x="37" y="39" width="516" height="522" rx="91" fill="url(#enamel)"
        stroke="#15181d" stroke-width="8"/>
  <rect x="48" y="50" width="494" height="500" rx="80" fill="none"
        stroke="#ffffff" stroke-opacity="0.25" stroke-width="7"/>

  <!-- Curved glass highlight is baked so UIPrerenderedIcon can remain enabled. -->
  <path d="M65 76 Q295 32 525 76 L525 220 Q295 178 65 236 Z" fill="url(#glass)"/>
  <path d="M72 82 Q295 45 518 82" fill="none" stroke="#ffffff"
        stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>

  <!-- Pocket mark: the same rounded controller geometry, redrawn at Retina resolution. -->
  <rect x="105" y="187" width="380" height="246" rx="88" fill="#000000" opacity="0.48"
        filter="url(#soft-shadow)"/>
  <rect x="98" y="175" width="394" height="246" rx="91" fill="url(#mark-chrome)"/>
  <rect x="127" y="201" width="336" height="190" rx="67" fill="url(#mark-face)"
        stroke="#ffffff" stroke-width="7"/>
  <ellipse cx="224" cy="296" rx="37" ry="39" fill="url(#mark-ink)"/>
  <rect x="305" y="250" width="112" height="28" rx="14" fill="url(#mark-ink)"/>
  <rect x="305" y="316" width="79" height="28" rx="14" fill="url(#mark-ink)"/>
  <path d="M144 224 Q295 196 446 224" fill="none" stroke="#ffffff"
        stroke-opacity="0.72" stroke-width="8" stroke-linecap="round"/>
</svg>
