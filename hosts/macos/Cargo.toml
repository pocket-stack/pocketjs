# pocket-macos — the PocketJS UI runtime in a gpui (Metal) macOS window:
# the stock host of the `macos-app` target (contracts/spec/platforms.ts).
#
# STANDALONE LONE-BIN CRATE (same model as hosts/pocketbook): outside any
# workspace with its own Cargo.lock, path-depending on the engine crates.
# gpui must never enter the ubuntu release workspace build, which is also why
# engine/backends/gpui sits on the engine exclude list.
#
# Build + run through `bun run macos <app>` (tools/macos.ts), or directly:
#   cargo run --release --manifest-path hosts/macos/Cargo.toml -- --app note-main

[package]
name = "pocket-macos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PocketJS UI runtime host on gpui/Metal — the macos-app target"

[dependencies]
pocketjs-core = { path = "../../engine/core", features = ["std"] }
pocket-mod = { path = "../../engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../../engine/crates/pocket-ui-surface" }
pocket-ui-gpui = { path = "../../engine/backends/gpui" }
gpui = "0.2.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = false
