name: Dynamic text coverage

on:
  pull_request:
    paths:
      - '.github/workflows/dynamic-text.yml'
      - 'framework/compiler/**'
      - 'framework/src/pak.ts'
      - 'framework/src/bytes.ts'
      - 'engine/core/**'
      - 'hosts/psp/src/ge.rs'
      - 'apps/music-cjk/**'
      - 'assets/fonts/**'
      - 'tests/font-config.test.ts'
      - 'tests/music-cjk.test.ts'
      - 'tools/build.ts'
      - 'tools/test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/core
            engine/wasm
      - run: cargo test --locked --manifest-path engine/core/Cargo.toml
      - run: bun tools/wasm.ts
      - run: bun test tests/font-bake.test.ts tests/font-config.test.ts tests/music-cjk.test.ts
