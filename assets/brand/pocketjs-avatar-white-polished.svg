<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="PocketJS avatar">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#171226" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#ffffff"/>
  <!-- default export: the capsule lifted off the canvas with a soft shadow -->
  <rect x="178" y="178" width="668" height="668" rx="146.125" fill="#171226" filter="url(#shadow)"/>
  <g transform="translate(178.0 178.0) scale(20.875)">
    <rect x="2" y="6" width="28" height="20" rx="6" fill="#ffd23f"/>
    <circle cx="10" cy="16" r="3.1" fill="#171226"/>
    <rect x="16" y="12.6" width="10" height="2.2" rx="1.1" fill="#171226"/>
    <rect x="16" y="17.2" width="6.5" height="2.2" rx="1.1" fill="#171226"/>
  </g>
</svg>