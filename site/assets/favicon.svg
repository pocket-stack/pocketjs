<!-- The PocketJS mark. This is the only drawing: tools/icons.ts rasterizes the
     whole browser and home-screen family from it, so the mark cannot drift
     between surfaces. Geometry is unchanged from the original controller —
     body 28x20 rx6, lens r3.1 at (10,16), bars 10x2.2 and 6.5x2.2 rx1.1 —
     but the body is filled rather than stroked and the three screen details
     are painted in the backing colour, so the mark carries one colour and
     survives 16px without a stroke thinning out. -->
<svg viewBox="0 0 32 32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#171226"/>
  <rect x="2" y="6" width="28" height="20" rx="6" fill="#ffd23f"/>
  <circle cx="10" cy="16" r="3.1" fill="#171226"/>
  <rect x="16" y="12.6" width="10" height="2.2" rx="1.1" fill="#171226"/>
  <rect x="16" y="17.2" width="6.5" height="2.2" rx="1.1" fill="#171226"/>
</svg>
