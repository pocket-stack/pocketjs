<!-- Safari pinned tab / favourites mask. Safari uses the alpha channel only and
     paints it in the colour the mask-icon link declares, so this is the same
     mark as favicon.svg with the gradients flattened to solid black. -->
<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="3" width="14" height="10" rx="3" fill="none" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="5" cy="8" r="1.55" fill="#000"/>
  <rect x="8" y="6.3" width="5" height="1.1" rx=".55" fill="#000"/>
  <rect x="8" y="8.6" width="3.25" height="1.1" rx=".55" fill="#000"/>
</svg>
