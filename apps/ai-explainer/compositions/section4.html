    <script>
      window.__timelines = window.__timelines || {};

        14.2

      // Helper function to draw dynamic bezier path for attention weight
      function drawAttentionCurve(canvasId, fromId, toId, color, weightText, weightVal) {
        const canvas = document.getElementById(canvasId);
        const fromEl = document.getElementById(fromId);
        const toEl = document.getElementById(toId);
        if (!canvas || !fromEl || !toEl) return;

        // Clear canvas
        canvas.innerHTML = "";

        const cRect = canvas.getBoundingClientRect();
        const fRect = fromEl.getBoundingClientRect();
        const tRect = toEl.getBoundingClientRect();

        const x1 = fRect.left - cRect.left + fRect.width / 2;
        const y1 = fRect.top - cRect.top + fRect.height / 2;
        const x2 = tRect.left - cRect.left + tRect.width / 2;
        const y2 = tRect.top - cRect.top + tRect.height / 2;

        // Control point for quadratic curve (bend upward slightly)
        const cx = (x1 + x2) / 2;
        const cy = Math.min(y1, y2) - 60;

        // Create Path
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", Math.max(2, weightVal * 12));
        path.setAttribute("fill", "transparent");
        path.setAttribute("stroke-dasharray", "2000");
        path.setAttribute("stroke-dashoffset", "2000");
        path.setAttribute("id", `curve-${fromId}-${toId}`);
        canvas.appendChild(path);

        // Create Text group for Weight Badge
        const textGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        textGroup.setAttribute("opacity", "0");
        textGroup.setAttribute("id", `badge-${fromId}-${toId}`);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", cx - 40);
        rect.setAttribute("y", cy - 18);
        rect.setAttribute("width", "80");
        rect.setAttribute("height", "26");
        rect.setAttribute("rx", "6");
        rect.setAttribute("fill", "#040814");
        rect.setAttribute("stroke", color);
        rect.setAttribute("stroke-width", "1.5");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", cx);
        text.setAttribute("y", cy);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", color);
        text.setAttribute("font-family", "JetBrains Mono");
        text.setAttribute("font-size", "14px");
        text.textContent = weightText;

        textGroup.appendChild(rect);
        textGroup.appendChild(text);
        canvas.appendChild(textGroup);
      }
