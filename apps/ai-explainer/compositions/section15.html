      .net-node.active-node {
        background: #10b981;
        box-shadow: 0 0 10px #10b981;
      }
      .net-line {
        stroke: rgba(148, 163, 184, 0.15);
        stroke-width: 2;
        fill: none;
      }
      .net-line.reinforced-line {
        stroke: #10b981;
        stroke-width: 6;
        filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4));
      }

      /* Reward curve panel */
      .reward-stat-card {
        background: rgba(4, 8, 20, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.15);

        align-items: center;

      .reward-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #94a3b8;
      }

        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 800;
        color: #cbd5e1;
        transition: color 0.4s ease;
      }
      .reward-value-display.reward-success {
        color: #10b981;
      }

      /* Chain of Thought Teaser overlay */
      .cot-teaser-panel {
        position: absolute;
        inset: 0;
        background: #040814;
        z-index: 30;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background: rgba(15, 23, 42, 0.95);
        border: 2px solid rgba(56, 189, 248, 0.25);
        border-radius: 16px;
        padding: 30px 40px;
        width: 640px;

        color: #fb923c;

      }

        line-height: 1.4;
        color: #f8fafc;
        margin-bottom: 20px;

      .cot-thinking-status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: #38bdf8;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .thinking-dot {
        width: 8px;
        height: 8px;
        background: #38bdf8;
        border-radius: 50%;

      /* Caption overlay */
      .caption-overlay {
        position: absolute;
        bottom: 100px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 100;
      }
      .caption-box {

        border-radius: 12px;
        font-size: 28px;
        font-weight: 500;
        color: #f8fafc;
        max-width: 1200px;
        text-align: center;
        line-height: 1.4;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    
      /* Disabled UI Elements */
      .caption-overlay,
      .tech-header > div:not(.status),
      .tech-footer > div:first-child {
        display: none !important;
      }
</style>

        { time: 35.0, text: "But for complex reasoning, simple feedback isn't enough. We need the model to think out loud." }
