    <script>
      window.__timelines = window.__timelines || {};

      // Ambient glows

      tl.to("#axis-pointer", { opacity: 1, duration: 0.3 }, 22.0);

      // 3. Pointer snap rounding animation (25s - 39s)

      tl.call(() => {
        document.getElementById("nline-val-lbl").innerText = "Weight: FP16 (0.8354)";
        document.getElementById("c1-1").className = "matrix-cell cell-highlight";
      }, [], 26.5);

      tl.call(() => {
        document.getElementById("nline-val-lbl").innerText = "Mapped Bucket: INT8 (6)";

        { time: 0.0, text: "Even small models can still be too large to fit in the RAM of a smartphone." },
        { time: 5.5, text: "To shrink them further, we use quantization." },
        { time: 9.8, text: "By default, model weights are stored as 16-bit floating-point numbers," },
        { time: 14.5, text: "which can take any value between a massive range." },
        { time: 18.2, text: "Quantization maps these high-precision floats into a tiny set of discrete integer buckets" },
        { time: 23.5, text: "—typically 8-bit or even 4-bit integers." },
        { time: 27.0, text: "Think of it like rounding numbers on a scale." },
        { time: 30.5, text: "Instead of remembering a weight is precisely zero point eight three five four," },
        { time: 35.8, text: "the model rounds it to a simple integer value like six." },
        { time: 39.8, text: "This reduces the file size of a model by seventy-five percent," },
