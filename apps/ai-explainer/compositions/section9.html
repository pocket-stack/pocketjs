      /* Caption overlay */

        text-align: center;
        line-height: 1.4;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .tech-header > div:not(.status),
      .tech-footer > div:first-child {
        display: none !important;
      }
</style>

        { time: 22.0, text: "When a user asks a question, we first search a database for relevant documents." },
        { time: 27.0, text: "We retrieve these documents, stuff them into the prompt as context, and send it to the LLM." },
