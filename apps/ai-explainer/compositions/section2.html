      .caption-overlay {

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ambient glows
      tl.to(".glow-left, .glow-right", {
        scale: 1.12,
        duration: 5,
        yoyo: true,
        repeat: 9,
        ease: "sine.inOut"
      }, 0);

      // 1. Initial State: token panel slides in (1.0s)
      tl.fromTo(".token-panel", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 1.0);

      // 2. Scanner Sweep animation (7s - 13s)
      // "The first step is called tokenization."
      tl.set("#scanner", { opacity: 0.8 }, 6.5);
      tl.fromTo("#scanner", { x: 0 }, { x: 760, duration: 4.5, ease: "power1.inOut" }, 7.0);
      tl.to("#scanner", { opacity: 0, duration: 0.3 }, 11.5);

      // 3. Stagger-load tokens (13s - 22s)
      // "Instead of treating an entire sentence as one giant object, the tokenizer breaks it..."
      tl.to("#chip-1", { opacity: 1, scale: 1, duration: 0.5 }, 13.0);
      tl.to("#text-all", { color: "#38bdf8", duration: 0.2 }, 13.0);

      tl.to("#chip-2", { opacity: 1, scale: 1, duration: 0.5 }, 14.5);
      tl.to("#text-that", { color: "#38bdf8", duration: 0.2 }, 14.5);

      tl.to("#chip-3", { opacity: 1, scale: 1, duration: 0.5 }, 16.0);
      // Highlight "glitt" sub-word split
      tl.to("#text-glitters", { color: "#f43f5e", duration: 0.2 }, 16.0);

      tl.to("#chip-4", { opacity: 1, scale: 1, duration: 0.5 }, 17.5);

      // 4. Emoji token addition (22s)
      // "Even emojis become tokens."
      tl.to("#text-emoji", { opacity: 1, duration: 0.5 }, 21.5);
      tl.to("#chip-5", { opacity: 1, scale: 1, duration: 0.5 }, 22.5);

      // 5. Flip cards or fade IDs (26s)
      // "Every token receives an ID. The language model never sees the word..."
      // Animate background color change of the chips, highlighting the ID label
      tl.to(".token-chip", { borderColor: "#60a5fa", backgroundColor: "rgba(30, 41, 59, 0.8)", duration: 0.8 }, 26.5);
      tl.to(".token-chip .word-val", { opacity: 0.3, duration: 0.6 }, 26.8);
      tl.fromTo(".id-label", { scale: 1.2, fontWeight: "bold" }, { scale: 1, fontWeight: "normal", duration: 0.6 }, 27.0);

      // 6. Vocabulary panel slides in (32s)
      // "But IDs alone don't carry meaning..."
      tl.to("#vocab-card", { opacity: 1, x: 0, duration: 1.0, ease: "power3.out" }, 31.5);

      // Highlight row comparisons
      // "Token 523 isn't inherently similar to token 524."
      tl.to("#row-523, #row-524", { className: "vocab-row highlight-compare", duration: 0.8 }, 33.0);

      // 7. Coordinate shift (40s)
      // "So the next challenge is teaching the model which words are actually related..."
      tl.to(".token-chip", { y: -20, opacity: 0.5, scale: 0.9, duration: 0.8 }, 41.0);
      tl.to("#vocab-card", { opacity: 0.3, duration: 0.8 }, 41.5);

      // Final Exit
      tl.to(".token-panel", { y: 100, opacity: 0, duration: 1.0, ease: "power3.in" }, 46.5);
      tl.to("#vocab-card", { x: 100, opacity: 0, duration: 1.0, ease: "power3.in" }, 46.8);

      // Captions timing
      const captions = [
        { time: 0.0, text: "Computers never actually read words." },
        { time: 3.2, text: "Everything must eventually become numbers." },
        { time: 6.8, text: "The first step is called tokenization." },
        { time: 10.0, text: "Instead of treating an entire sentence as one giant object," },
        { time: 13.5, text: "the tokenizer breaks it into smaller pieces called tokens." },
        { time: 18.0, text: "Sometimes they're whole words. Sometimes they're parts of words. Sometimes they're punctuation." },
        { time: 22.0, text: "Even emojis become tokens." },
        { time: 25.5, text: "Every token receives an ID." },
        { time: 28.0, text: "The language model never sees the word itself. It only sees these numerical IDs." },
        { time: 32.0, text: "But IDs alone don't carry meaning." },
        { time: 35.0, text: "Token 523 isn't inherently similar to token 524." },
        { time: 40.0, text: "So the next challenge is teaching the model which words are actually related." },
        { time: 45.0, text: "That's where vectors come in." }
      ];

      captions.forEach((cap, i) => {

        }, [], cap.time);
      });
