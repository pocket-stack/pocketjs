    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Generate 200 grid dots inside the haystack card to prevent layout check errors
      const grid = document.getElementById("dots-grid");
      for (let i = 0; i < 200; i++) {
        const dot = document.createElement("div");
        dot.className = "hay-dot";
        dot.id = `dot-${i}`;
        grid.appendChild(dot);
      }

      // Ambient glows
      tl.to(".glow-left, .glow-right", {
        scale: 1.12,
        duration: 5,
        yoyo: true,
        repeat: 9,
        ease: "sine.inOut"
      }, 0);

      // 1. Initial State: workspace entrance (3s)
      tl.to("#workspace-card", { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 3.0);

      // 2. Initial state: progress bar starts small (4,000 tokens) (6s)
      tl.call(() => {
        document.getElementById("progress-bar").style.width = "0.2%";
        document.getElementById("t-count").innerText = "4,000 TOKENS";
      }, [], 4.0);

      // 3. Context window expands surge (14s)
      tl.to("#stack-box", { opacity: 1, x: 0, duration: 0.8 }, 14.0);
      
      tl.call(() => {
        // Surge progress fill and token counter text
        const fill = document.getElementById("progress-bar");
        fill.style.width = "100%";
        
        let val = 4000;
        const target = 2000000;
        const speed = (target - val) / 50; // step count
        const timer = setInterval(() => {
          if (val < target) {
            val += Math.floor(speed);
            if (val > target) val = target;
            document.getElementById("t-count").innerText = val.toLocaleString() + " TOKENS";
          } else {
            clearInterval(timer);
          }
        }, 30);
      }, [], 14.5);

      // Ingest stack items one by one (18s)
      tl.to("#stack-1", { opacity: 1, y: 0, duration: 0.5 }, 18.0);
      tl.to("#stack-2", { opacity: 1, y: 0, duration: 0.5 }, 19.5);
      tl.to("#stack-3", { opacity: 1, y: 0, duration: 0.5 }, 21.0);

      // Mark ingested active styles (22s)
      tl.to("#stack-1, #stack-2, #stack-3", { className: "stack-item ingested", duration: 0.5 }, 22.5);

      // 4. Needle in a Haystack panel display (30s)
      tl.to("#workspace-card, #stack-box", { opacity: 0.1, duration: 0.8 }, 30.0);
      tl.to("#haystack-card", { opacity: 1, scale: 1.0, duration: 0.8, ease: "power2.out" }, 30.5);

      // Stagger highlight dots representing searching
      tl.to(".hay-dot", { background: "rgba(56, 189, 248, 0.4)", duration: 0.2, stagger: 0.005 }, 31.0);

      // Plant golden needle at dot index 137 (35s)
      tl.call(() => {
        const dot = document.getElementById("dot-137");
        if (dot) dot.className = "hay-dot hay-needle";
      }, [], 35.0);

      // Search locks on to needle card popup (37s)
      tl.to("#needle-desc-box", { opacity: 1, scale: 1.0, duration: 0.6, ease: "back.out(1.2)" }, 37.0);
      
      tl.call(() => {
        document.getElementById("haystack-status-txt").innerText = "STATUS: 100% RETRIEVAL ACCURACY";
        document.getElementById("haystack-status-txt").style.color = "#10b981";
      }, [], 37.5);

      // 5. Caching badge pops up (43s - 54.49s)
      tl.to("#caching-badge", { opacity: 1, scale: 1.0, duration: 0.6, ease: "back.out(1.2)" }, 43.0);

      // Final Exit
      tl.to("#haystack-card, #needle-desc-box", { opacity: 0, scale: 0.9, duration: 1.0, ease: "power2.in" }, 52.5);

      // Captions timing
      const captions = [
        { time: 0.0, text: "Every time you chat with a model, it reads your prompt, the history, and any context you provide." },
        { time: 6.2, text: "This temporary working space is the Context Window." },
        { time: 9.8, text: "Early models could only remember a few pages of text—around 4,000 tokens." },
        { time: 14.5, text: "If you went past that, they forgot the beginning of the conversation." },
        { time: 18.2, text: "But today, modern models have context windows of up to two million tokens." },
        { time: 22.5, text: "That's enough to hold an entire codebase, hours of audio, or thirty books in active memory." },
        { time: 29.8, text: "To prove this capacity, developers run a test called \"Needle in a Haystack\"." },
        { time: 34.0, text: "They hide a random, unrelated sentence deep inside a million words of text and ask the model to find it." },
        { time: 40.5, text: "Modern reasoning models pass this with near-perfect accuracy." },
        { time: 44.5, text: "But how does a model keep track of these long conversations across different turns and sessions?" },
        { time: 50.0, text: "For that, it needs a way to save its state. Enter Context Caching." }
      ];

      captions.forEach((cap, i) => {
        tl.call(() => {
          document.getElementById("caption-text").innerText = cap.text;
        }, [], cap.time);
      });

      window.__timelines["scene-sec12"] = tl;
    </script>
